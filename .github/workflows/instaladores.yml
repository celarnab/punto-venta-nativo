# Pruebas en cada push; instaladores para Windows (10/11 y 7 de 32 bits), macOS y Linux al publicar una
# etiqueta vX.Y.Z o a mano.
name: Instaladores

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # Lo que necesita Slint (ventanas, fuentes y teclado) para compilar en Linux.
  DEPENDENCIAS_LINUX: libfontconfig1-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-xcb-dev libwayland-dev libgl1-mesa-dev

jobs:
  pruebas:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y $DEPENDENCIAS_LINUX
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p nucleo -p impresion
      - run: cargo clippy --workspace --all-targets -- -D warnings

  instaladores:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: pruebas
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sistema: windows-latest, objetivo: x86_64-pc-windows-msvc, formatos: nsis, nombre: Windows }
          # Windows 7 de 32 bits: Rust solo lo soporta en «tier 3», sin biblioteca estándar precompilada; se
          # compila con nightly (build-std). Ver los pasos marcados con `matrix.win7`.
          - { sistema: windows-latest, objetivo: i686-win7-windows-msvc, formatos: nsis, nombre: Windows7-32bits, win7: true }
          # En macOS se genera la .app, se firma completa y el .dmg se arma aparte (ver abajo).
          - { sistema: macos-latest, objetivo: aarch64-apple-darwin, formatos: app, nombre: macOS-AppleSilicon }
          - { sistema: macos-latest, objetivo: x86_64-apple-darwin, formatos: app, nombre: macOS-Intel }
          - { sistema: ubuntu-22.04, objetivo: x86_64-unknown-linux-gnu, formatos: "deb,appimage", nombre: Linux }
    runs-on: ${{ matrix.sistema }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $DEPENDENCIAS_LINUX libfuse2
      - if: ${{ !matrix.win7 }}
        uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.objetivo }}" }
      # Un nightly fijo: build-std a veces se rompe de un día para otro (el del 15/10/2026 no compilaba std para
      # Windows 7, ver rust-lang/rust#164360).
      - if: ${{ matrix.win7 }}
        uses: dtolnay/rust-toolchain@master
        with: { toolchain: nightly-2026-10-17, components: "rust-src, llvm-tools" }
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.objetivo }}" }
      - run: cargo install cargo-packager --locked
      - name: Compilar e instaladores
        working-directory: crates/app
        shell: bash
        run: |
          if [ "${{ matrix.win7 }}" = "true" ]; then
            # El runtime de C va dentro del .exe: Windows 7 no trae el de Visual C++.
            RUSTFLAGS="-C target-feature=+crt-static" \
              cargo build --release -p punto-venta --target ${{ matrix.objetivo }} -Z build-std
          else
            cargo build --release -p punto-venta --target ${{ matrix.objetivo }}
          fi
          cargo packager --release --target ${{ matrix.objetivo }} --formats ${{ matrix.formatos }}
          if [ "${{ matrix.win7 }}" = "true" ]; then
            for f in ../../target/instaladores/*_x86-setup.exe; do mv "$f" "${f/_x86-setup/_windows7-32bits-setup}"; done
          fi
      # Si el .exe pide al arrancar una sola función que Windows 7 no tiene, ni siquiera abre («no se encontró el
      # punto de entrada…»). combase.dll y la de errores de WinRT (Windows 8) deben estar diferidas, y de ellas solo
      # lo que src/win7.rs sabe sustituir; ninguna otra de Windows 8 o posterior.
      - name: Revisar que abra en Windows 7
        if: ${{ matrix.win7 }}
        shell: bash
        run: |
          exe="target/${{ matrix.objetivo }}/release/punto-venta.exe"
          timeout 60 "$exe" --probar-win7 || { echo "::error::Falló --probar-win7"; exit 1; }
          objdump="$(rustc --print sysroot)/lib/rustlib/x86_64-pc-windows-msvc/bin/llvm-objdump.exe"
          "$objdump" -p "$exe" > importaciones.txt
          sed '/The Delay Import Tables/,$d' importaciones.txt > al-arrancar.txt
          awk '/The Delay Import Tables/ { d = 1 } /DLL Name:/ { dll = tolower($3); next }
               d && /^ +[0-9]+ +[A-Za-z_]/ { print dll, $2 }' importaciones.txt > diferidas.txt
          echo "Al arrancar:"; grep -i "DLL Name" al-arrancar.txt
          echo "Diferidas:"; cat diferidas.txt
          nuevas='combase\.dll|shcore\.dll|api-ms-win-core-synch-l1-2|api-ms-win-crt-|vcruntime140|api-ms-win-core-winrt|GetSystemTimePreciseAsFileTime|WaitOnAddress|WakeByAddress|GetDpiFor|GetSystemMetricsForDpi|AdjustWindowRectExForDpi|DpiAwarenessContext|EnableNonClientDpiScaling|SetThreadDescription|GetThreadDescription|CreateFile2|ProcessPrng|GetCurrentThreadStackLimits'
          if grep -E -i "$nuevas" al-arrancar.txt; then
            echo "::error::El .exe pide al arrancar funciones que Windows 7 no tiene (arriba)."
            exit 1
          fi
          grep -q '^combase.dll ' diferidas.txt || { echo "::error::combase.dll no quedó diferida"; exit 1; }
          conocidas='^(CoTaskMemAlloc|CoTaskMemFree|CoCreateFreeThreadedMarshaler|CoIncrementMTAUsage|RoGetAgileReference|RoOriginateErrorW)$'
          if awk '{ print $2 }' diferidas.txt | grep -E -v "$conocidas"; then
            echo "::error::Funciones diferidas que src/win7.rs no sabe sustituir (arriba)."
            exit 1
          fi
      - name: Firmar la app y armar el .dmg
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="target/instaladores/Punto de Venta.app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          mkdir -p dmg && cp -R "$app" dmg/ && ln -s /Applications dmg/Applications
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          hdiutil create -volname "Punto de Venta" -srcfolder dmg -ov -format UDZO \
            "target/instaladores/Punto de Venta_${version}_${{ matrix.nombre }}.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: instalador-${{ matrix.nombre }}
          if-no-files-found: error
          path: |
            target/instaladores/*.exe
            target/instaladores/*.dmg
            target/instaladores/*.deb
            target/instaladores/*.AppImage
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            target/instaladores/*.exe
            target/instaladores/*.dmg
            target/instaladores/*.deb
            target/instaladores/*.AppImage
