[package]
name = "punto-venta"
description = "Punto de venta de escritorio"
version.workspace = true
edition.workspace = true

[dependencies]
nucleo = { path = "../nucleo" }
impresion = { path = "../impresion" }
slint = "1.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = "0.4.45"
rfd = "0.17.2"
directories = "6.0.0"
png = { version = "0.18.1", optional = true }

# Windows 7: se dibuja sin la tarjeta de video (ver `main`), con las fuentes del sistema.
[target.'cfg(target_vendor = "win7")'.dependencies]
slint = { version = "1.18.1", features = ["software-renderer-systemfonts"] }

[build-dependencies]
slint-build = "1.18.1"

[features]
# Solo para desarrollo: `cargo run --features captura -- --captura carpeta/` dibuja cada pantalla con
# datos de ejemplo y guarda imágenes, sin abrir ventanas.
captura = ["slint/renderer-software", "slint/software-renderer-systemfonts", "dep:png"]

# Instaladores: `cargo build --release -p punto-venta && cargo packager --release`
# (Windows .exe, macOS .dmg, Linux .deb y .AppImage).
[package.metadata.packager]
product-name = "Punto de Venta"
identifier = "mx.negocio.puntodeventa"
publisher = "Punto de Venta"
category = "Business"
description = "Punto de venta de escritorio"
icons = ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.icns", "icons/icon.ico"]
out-dir = "../../target/instaladores"

[package.metadata.packager.deb]
depends = ["libfontconfig1", "libxkbcommon0"]
